<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro de Ventas - Moto Service</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{--black:#0a0a0a;--dark:#1a1a1a;--gray:#f2f3f5;--gray-border:#e5e7eb;--gray-text:#6b7280;--red:#dc2626;--white:#ffffff}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:var(--gray);display:flex;min-height:100vh}

.panel-left{width:390px;background:var(--white);border-right:1px solid var(--gray-border);padding:28px 24px;display:flex;flex-direction:column;gap:28px;min-height:100vh}
.logo{display:flex;align-items:center;gap:12px;padding-bottom:20px;border-bottom:1px solid var(--gray-border)}
.logo-icon{width:42px;height:42px;background:var(--black);color:var(--white);display:grid;place-items:center;border-radius:12px}
.logo h1{font-size:17px;font-weight:700;letter-spacing:-0.5px}
.logo p{font-size:11px;color:var(--gray-text);font-weight:500;letter-spacing:0.5px;text-transform:uppercase;margin-top:2px}

.form{ display:flex; flex-direction:column; gap:22px }
.form-group{display:flex;flex-direction:column;gap:10px}
.form-group label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:var(--black)}
.input-wrap{position:relative}
.input-wrap i{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:#9ca3af}
.input-wrap input, .input-wrap select{width:100%;height:52px;padding:0 14px 0 44px;border:1.5px solid var(--gray-border);border-radius:14px;background:var(--white);font-size:14px;font-weight:500;outline:none;transition:0.2s}
.input-wrap input:focus, .input-wrap select:focus{border-color:var(--black)}
.input-wrap select{appearance:none;cursor:pointer}
.autocomplete-list{position:absolute;top:56px;left:0;right:0;background:var(--white);border:1px solid var(--gray-border);border-radius:12px;box-shadow:0 10px 25px rgba(0,0,0,0.08);z-index:20;max-height:160px;overflow:auto;display:none}
.autocomplete-list div{padding:12px 14px;font-size:13px;cursor:pointer}
.autocomplete-list div:hover{background:var(--gray)}

.btn-confirm{height:54px;background:var(--black);color:var(--white);border:none;border-radius:14px;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;transition:0.2s;margin-top:8px}
.btn-confirm:hover{background:var(--dark)}
.btn-confirm.editing{background:var(--white);color:var(--black);border:1.5px solid var(--black)}
.btn-cancel{height:46px;background:transparent;color:var(--gray-text);border:none;font-size:13px;font-weight:600;cursor:pointer;display:none}

.panel-right{flex:1;padding:28px;max-width:900px}
.header-right{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:24px;gap:16px;flex-wrap:wrap}
.header-right h2{font-size:22px;font-weight:700;letter-spacing:-0.5px}
.stats{display:flex;gap:12px}
.stat{ background:var(--white); border:1px solid var(--gray-border); padding:14px 18px; border-radius:14px; min-width:135px}
.stat span{font-size:10px;color:var(--gray-text);font-weight:700;text-transform:uppercase;letter-spacing:0.8px}
.stat strong{font-size:20px;display:block;margin-top:4px}
.stat.red{ background:var(--red); color:var(--white); border-color:var(--red)}
.stat.red span{color:rgba(255,255,255,0.8)}

.table-wrap{background:var(--white);border:1px solid var(--gray-border);border-radius:18px;overflow:hidden}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:var(--gray-text);padding:16px 20px;background:#fafafa;border-bottom:1px solid var(--gray-border)}
td{padding:18px 20px;font-size:14px;font-weight:500;border-bottom:1px solid #f3f4f6}
.badge{padding:6px 10px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:0.5px}
.badge.mandado{background:#111;color:#fff}
.badge.transporte{background:#fee2e2;color:var(--red)}
.actions{display:flex;gap:8px;justify-content:flex-end}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--gray-border);background:var(--white);display:grid;place-items:center;cursor:pointer;transition:0.2s}
.icon-btn:hover{background:var(--gray)}
.icon-btn.delete:hover{background:#fef2f2;border-color:#fecaca;color:var(--red)}
.empty{padding:60px;text-align:center;color:var(--gray-text)}
.empty p{font-size:13px;margin-top:8px}

/* CELULAR */
@media(max-width:800px){
  body{flex-direction:column}
  .panel-left{width:100%;min-height:auto;border-right:none;border-bottom:1px solid var(--gray-border);border-radius:0 0 24px 24px;padding:22px 18px}
  .panel-right{padding:18px}
  th:nth-child(4), td:nth-child(4){display:none}
}
</style>
</head>
<body>

<div class="panel-left">
  <div class="logo">
    <div class="logo-icon"><i data-lucide="zap"></i></div>
    <div><h1>MOTO LOG</h1><p>Control de Ventas</p></div>
  </div>

  <div class="form">
    <div class="form-group">
      <label>Nombre del Cliente</label>
      <div class="input-wrap">
        <i data-lucide="user"></i>
        <input type="text" id="cliente" placeholder="Ej. Carlos Medina" autocomplete="off" oninput="autocompletar()">
        <div id="listaClientes" class="autocomplete-list"></div>
      </div>
    </div>

    <div class="form-group">
      <label>Valor del Servicio</label>
      <div class="input-wrap">
        <i data-lucide="dollar-sign"></i>
        <input type="number" id="valor" placeholder="0.00" inputmode="decimal">
      </div>
    </div>

    <div class="form-group">
      <label>Tipo de Servicio</label>
      <div class="input-wrap">
        <i data-lucide="bike"></i>
        <select id="tipo">
          <option value="">Seleccionar servicio</option>
          <option value="Moto Mandado">Moto Mandado</option>
          <option value="Moto Transporte">Moto Transporte</option>
        </select>
      </div>
    </div>

    <button class="btn-confirm" id="btnMain" onclick="confirmarVenta()">
      <i data-lucide="check-circle-2"></i> <span id="btnText">Confirmar Venta</span>
    </button>
    <button class="btn-cancel" id="btnCancel" onclick="cancelarEdicion()">Cancelar edición</button>
  </div>
</div>

<div class="panel-right">
  <div class="header-right">
    <h2>Historial de Ventas</h2>
    <div class="stats">
      <div class="stat"><span>Ventas Hoy</span><strong id="totalVentas">0</strong></div>
      <div class="stat red"><span>Total Hoy</span><strong id="totalMonto">$0</strong></div>
    </div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Cliente</th>
          <th>Servicio</th>
          <th>Valor</th>
          <th>Fecha</th>
          <th style="text-align:right">Acción</th>
        </tr>
      </thead>
      <tbody id="tablaHistorial"></tbody>
    </table>
    <div id="emptyState" class="empty">
      <i data-lucide="inbox" style="width:32px;height:32px"></i>
      <p>No hay ventas registradas aún</p>
    </div>
  </div>
</div>

<script>
lucide.createIcons();
let ventas = JSON.parse(localStorage.getItem('ventasMoto') || '[]');
let clientes = JSON.parse(localStorage.getItem('clientesMoto') || '[]');
let editIndex = -1;

function autocompletar(){
  const input = document.getElementById('cliente').value.toLowerCase();
  const lista = document.getElementById('listaClientes');
  if(!input){lista.style.display='none';return;}
  const filtrados = clientes.filter(c=>c.toLowerCase().includes(input));
  if(filtrados.length===0){lista.style.display='none';return;}
  lista.innerHTML = filtrados.map(c=>`<div onclick="seleccionarCliente('${c}')">${c}</div>`).join('');
  lista.style.display='block';
}
function seleccionarCliente(nombre){
  document.getElementById('cliente').value=nombre;
  document.getElementById('listaClientes').style.display='none';
}
function confirmarVenta(){
  const cliente = document.getElementById('cliente').value.trim();
  const valor = parseFloat(document.getElementById('valor').value);
  const tipo = document.getElementById('tipo').value;
  if(!cliente || !valor || !tipo){alert('Completa todos los campos');return;}
  
  if(editIndex >= 0){
    ventas[editIndex].cliente = cliente;
    ventas[editIndex].valor = valor;
    ventas[editIndex].tipo = tipo;
    editIndex = -1;
  } else {
    const ahora = new Date();
    ventas.unshift({cliente, valor, tipo, fecha: ahora.toLocaleDateString(), hora: ahora.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}), timestamp: ahora.getTime()});
    if(!clientes.includes(cliente)){clientes.push(cliente);}
  }
  localStorage.setItem('ventasMoto', JSON.stringify(ventas));
  localStorage.setItem('clientesMoto', JSON.stringify(clientes));
  resetForm();
  renderHistorial();
}
function editarVenta(i){
  const v = ventas[i];
  document.getElementById('cliente').value = v.cliente;
  document.getElementById('valor').value = v.valor;
  document.getElementById('tipo').value = v.tipo;
  editIndex = i;
  document.getElementById('btnText').innerText = 'Guardar Cambios';
  document.getElementById('btnMain').classList.add('editing');
  document.getElementById('btnCancel').style.display = 'block';
  window.scrollTo({top:0, behavior:'smooth'});
}
function cancelarEdicion(){ resetForm(); }
function resetForm(){
  document.getElementById('cliente').value=''; document.getElementById('valor').value=''; document.getElementById('tipo').value='';
  document.getElementById('btnText').innerText='Confirmar Venta';
  document.getElementById('btnMain').classList.remove('editing');
  document.getElementById('btnCancel').style.display='none';
  editIndex=-1;
  lucide.createIcons();
}
function eliminarVenta(i){
  if(!confirm('¿Eliminar esta venta?')) return;
  ventas.splice(i,1);
  localStorage.setItem('ventasMoto', JSON.stringify(ventas));
  renderHistorial();
}
function renderHistorial(){
  const tbody = document.getElementById('tablaHistorial');
  const empty = document.getElementById('emptyState');
  if(ventas.length===0){tbody.innerHTML=''; empty.style.display='block'; document.getElementById('totalVentas').innerText='0'; document.getElementById('totalMonto').innerText='$0'; return;}
  empty.style.display='none';
  tbody.innerHTML = ventas.map((v,i)=>`
    <tr>
      <td>${v.cliente}</td>
      <td><span class="badge ${v.tipo==='Moto Mandado'?'mandado':'transporte'}">${v.tipo.toUpperCase()}</span></td>
      <td>$${v.valor.toFixed(2)}</td>
      <td style="color:#6b7280;font-size:12px">${v.fecha} - ${v.hora}</td>
      <td><div class="actions">
        <button class="icon-btn" onclick="editarVenta(${i})"><i data-lucide="pencil" style="width:16px;height:16px"></i></button>
        <button class="icon-btn delete" onclick="eliminarVenta(${i})"><i data-lucide="trash-2" style="width:16px;height:16px"></i></button>
      </div></td>
    </tr>`).join('');
  lucide.createIcons();
  const hoy = new Date().toLocaleDateString();
  const ventasHoy = ventas.filter(v=>v.fecha===hoy);
  document.getElementById('totalVentas').innerText = ventasHoy.length;
  document.getElementById('totalMonto').innerText = '$' + ventasHoy.reduce((a,b)=>a+b.valor,0).toFixed(2);
}
document.addEventListener('click', e=>{ if(!e.target.closest('.input-wrap')) document.getElementById('listaClientes').style.display='none'; });
renderHistorial();
</script>
</body>
</html>
