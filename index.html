<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KIGO XPRESS</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{--black:#0a0a0a;--gray:#f2f3f5;--border:#e5e7eb;--text:#6b7280;--red:#dc2626;--green:#16a34a;--white:#fff}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:var(--gray);min-height:100vh;padding-bottom:80px}
.top{height:52px;background:var(--white);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0;z-index:10}
.view{display:none;padding:12px;max-width:650px;margin:0 auto}.view.active{display:block}
.card{background:var(--white);border:1px solid var(--border);border-radius:16px;padding:16px}
.group{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}.label-row{display:flex;align-items:center;gap:6px}.label-row i{width:14px;height:14px;color:#6b7280}.label-row label{font-size:9px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--text)}
.wrap{position:relative}.wrap input,.wrap select{width:100%;height:48px;padding:0 12px;border:1.5px solid var(--border);border-radius:12px;font-size:13px;font-weight:500;outline:none}
.btn{width:100%;height:50px;background:var(--black);color:#fff;border:none;border-radius:12px;font-weight:700;display:flex;gap:6px;align-items:center;justify-content:center;cursor:pointer}
.btn-green{width:100%;height:46px;background:#25D366;color:#fff;border:none;border-radius:12px;font-weight:700;display:flex;gap:8px;align-items:center;justify-content:center;cursor:pointer}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.stat{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:10px}.stat span{font-size:8px;font-weight:700;color:var(--text);text-transform:uppercase;letter-spacing:.6px}.stat strong{font-size:15px;display:block;margin-top:2px}.stat.red{background:var(--red);color:#fff;border-color:var(--red)}.stat.red span{color:rgba(255,255,255,.8)}.stat.dark{background:var(--black);color:#fff}.stat.dark span{color:#9ca3af}
.date-bar{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:10px;display:flex;gap:8px;align-items:center;margin-bottom:10px}.date-bar input{flex:1;height:36px;border:1.5px solid var(--border);border-radius:8px;padding:0 10px;font-weight:600;font-size:12px}
.table-wrap{background:var(--white);border:1px solid var(--border);border-radius:12px;overflow-x:auto;-webkit-overflow-scrolling:touch}.table-wrap table{min-width:560px;width:100%;border-collapse:collapse}
th{font-size:8px;text-transform:uppercase;color:var(--text);text-align:left;padding:8px 10px;background:#fafafa;border-bottom:1px solid var(--border)}td{padding:8px 10px;font-size:11px;border-bottom:1px solid #f3f4f6;line-height:1.2}
.row-pagado td{background:#dcfce7!important;color:#166534}.row-debe td{background:#fee2e2!important;color:#991b1b}.row-promo td{background:#f3e8ff!important;color:#6b21a8}
.actions{display:flex;gap:4px;justify-content:flex-end}.icon{width:26px;height:26px;border-radius:6px;border:1px solid var(--border);background:#fff;display:grid;place-items:center;cursor:pointer}.icon.pagado{background:var(--green);border-color:var(--green);color:#fff}.icon.debe{background:var(--red);border-color:var(--red);color:#fff}
.bottom{position:fixed;bottom:0;left:0;right:0;height:68px;background:var(--white);border-top:1px solid var(--border);display:flex;z-index:20}.bottom button{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:8px;font-weight:700;color:var(--text);cursor:pointer}.bottom button.active{color:var(--black)}
#list{position:absolute;top:52px;left:0;right:0;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 20px rgba(0,0,0,.08);display:none;z-index:10;max-height:140px;overflow:auto}#list div{padding:9px 12px;cursor:pointer;font-size:12px;border-bottom:1px solid #f3f4f6}
.badge{font-size:8px;font-weight:700;padding:2px 6px;border-radius:20px;display:inline-block;margin-top:2px}.badge-mandado{background:#fef3c7;color:#92400e}.badge-transporte{background:#dbeafe;color:#1e40af}.badge-promo{background:#e9d5ff;color:#6b21a8}
.filtros-tipo{display:flex;gap:6px;margin-bottom:10px}.filtros-tipo button{flex:1;height:38px;border-radius:10px;border:1.5px solid var(--border);background:#fff;font-weight:700;font-size:11px;cursor:pointer}.filtros-tipo button.active{background:var(--black)!important;color:#fff!important;border-color:var(--black)!important}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--black);color:#fff;padding:6px 10px;border-radius:20px;font-size:11px;font-weight:600;margin:4px}
.btn-promo{height:48px;min-width:48px;padding:0 12px;background:#fff;border:1.5px solid var(--border);border-radius:12px;display:grid;place-items:center;cursor:pointer}.btn-promo.active{background:var(--green);border-color:var(--green);color:#fff}
</style>
</head>
<body>
<div class="top"><b>KIGO XPRESS</b><i data-lucide="bike" style="width:18px"></i></div>
<div id="view-inicio" class="view active"><div class="card">
<div class="group"><div class="label-row"><i data-lucide="calendar"></i><label>Fecha</label></div><div class="wrap"><input type="date" id="fecha"></div></div>
<div class="group"><div class="label-row"><i data-lucide="store"></i><label>Cliente</label></div><div class="wrap"><input type="text" id="cliente" placeholder="Ej. El caldito" oninput="auto()" autocomplete="off"><div id="list"></div></div></div>
<div class="group"><div class="label-row"><i data-lucide="package"></i><label>Tipo</label></div><div class="wrap"><select id="tipo"><option value="Moto Mandado">Moto Mandado</option><option value="Moto Transporte">Moto Transporte</option></select></div></div>
<div class="group"><div class="label-row"><i data-lucide="dollar-sign"></i><label>Valor del servicio</label></div><div style="display:flex;gap:6px"><div class="wrap" style="flex:1"><input type="number" id="valor" placeholder="0"><input type="text" id="valorPromo" value="PROMOCION" style="display:none;background:#f3e8ff;border-color:#a855f7;color:#6b21a8;font-weight:800;text-align:center" disabled></div><button id="btnPromo" class="btn-promo" onclick="togglePromo()"><i data-lucide="gift" style="width:18px"></i></button></div></div>
<div class="group"><div class="label-row"><i data-lucide="user"></i><label>Repartidor</label></div><div class="wrap"><select id="repa"><option>Jose</option><option>Diego Gómez</option><option>Diego</option><option>Carlos</option></select></div></div>
<button class="btn" onclick="guardar()"><i data-lucide="check" style="width:16px"></i><span id="btnT">Confirmar</span></button>
<button id="btnC" onclick="cancelar()" style="display:none;width:100%;height:36px;background:none;border:none;font-size:11px;font-weight:600;color:#6b7280;cursor:pointer;margin-top:6px">Cancelar</button>
</div></div>
<div id="view-hoy" class="view"><div class="filtros-tipo"><button id="fHoyTodos" class="active" onclick="setFiltroHoy('todos')">Todos</button><button id="fHoyMandado" onclick="setFiltroHoy('Moto Mandado')">Mandados</button><button id="fHoyTransporte" onclick="setFiltroHoy('Moto Transporte')">Transporte</button></div><div class="card" style="margin-bottom:10px"><div style="font-size:11px;font-weight:700;margin-bottom:8px">HOY - <span id="hoyFecha"></span> <span id="hoyTipoLabel"></span></div><div class="stats"><div class="stat"><span>Pedidos</span><strong id="hCount">0</strong></div><div class="stat"><span>Bruto</span><strong id="hBruto">$0</strong></div><div class="stat dark"><span>Repartidor</span><strong id="hRep">$0</strong></div><div class="stat red"><span>KIGO pagado</span><strong id="hKigo">$0</strong></div></div></div><div class="table-wrap"><table><thead><tr><th>Hora</th><th>Cliente</th><th>Tipo</th><th>Bruto</th><th></th></tr></thead><tbody id="tbodyHoy"></tbody></table></div></div>
<div id="view-historial" class="view"><div class="filtros-tipo"><button id="fHistTodos" class="active" onclick="setFiltroHistTipo('todos')">Todos</button><button id="fHistMandado" onclick="setFiltroHistTipo('Moto Mandado')">Mandados</button><button id="fHistTransporte" onclick="setFiltroHistTipo('Moto Transporte')">Transporte</button></div><div class="date-bar"><input type="date" id="filtroFecha" onchange="filtrarFecha()"><button onclick="limpiarFiltro()" style="height:36px;padding:0 10px;border-radius:8px;border:1px solid var(--border);background:#fff;font-weight:700;cursor:pointer;font-size:11px">Todos</button></div><div class="stats"><div class="stat"><span>Pedidos</span><strong id="sCount">0</strong></div><div class="stat"><span>Bruto</span><strong id="sBruto">$0</strong></div><div class="stat dark"><span>Repar.</span><strong id="sRep">$0</strong></div><div class="stat red"><span>KIGO</span><strong id="sKigo">$0</strong></div></div><div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Cliente</th><th>Tipo</th><th>Bruto</th><th>KIGO</th><th>Repar.</th><th></th></tr></thead><tbody id="tbody"></tbody></table></div></div>
<div id="view-cobros" class="view"><div class="card" style="margin-bottom:10px">
<div style="font-weight:800;font-size:14px;margin-bottom:10px">COBROS - DEUDAS</div>
<div class="group"><div class="label-row"><label>Repartidor</label></div><div class="wrap"><select id="cobroRepa" onchange="renderCobros()"><option value="todos">Todos</option><option>Jose</option><option>Diego Gómez</option><option>Diego</option><option>Carlos</option></select></div></div>
<div class="group"><div class="label-row"><label>Agregar fechas</label></div><div style="display:flex;gap:6px"><div class="wrap" style="flex:1"><input type="date" id="cobroFecha"></div><button onclick="addFechaCobro()" style="height:48px;padding:0 16px;background:var(--black);color:#fff;border:none;border-radius:12px;font-weight:700;cursor:pointer">+</button></div></div>
<div id="chipsFechas" style="margin-top:8px"></div>
<div style="display:flex;gap:6px;margin-top:10px"><button onclick="limpiarFechasCobro()" style="flex:1;height:32px;border:1px solid var(--border);background:#fff;border-radius:8px;font-size:11px;font-weight:600">Limpiar</button><button onclick="addHoyAyer()" style="flex:1;height:32px;border:1px solid var(--border);background:#fff;border-radius:8px;font-size:11px;font-weight:600">Hoy+Ayer</button></div>
</div>
<div id="resumenCobros"></div>
<div class="card" id="cardDetalleCobros" style="display:none;margin-top:10px">
<div style="font-size:11px;font-weight:700;color:#6b7280;margin-bottom:8px">Solo pendientes (rojo)</div>
<div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Cliente</th><th>Tipo</th><th>Valor</th></tr></thead><tbody id="tbodyCobros"></tbody></table></div>
<div style="margin-top:12px"><button class="btn-green" onclick="compartirCobroWhatsApp()"><i data-lucide="message-circle" style="width:18px"></i> Enviar deuda WhatsApp</button></div>
</div></div>
<div class="bottom">
<button id="b-inicio" class="active" onclick="showView('inicio')"><i data-lucide="home" style="width:18px"></i>INICIO</button>
<button id="b-hoy" onclick="showView('hoy')"><i data-lucide="sun" style="width:18px"></i>HOY</button>
<button id="b-historial" onclick="showView('historial')"><i data-lucide="history" style="width:18px"></i>HISTORIAL</button>
<button id="b-cobros" onclick="showView('cobros')"><i data-lucide="wallet" style="width:18px"></i>COBROS</button>
</div>
<script>
let promosNuevas=[
{iso:'2026-08-10',cliente:'Calle 7',tipo:'Moto Mandado',valor:0,repa:'Jose',pagado:true,promo:true,ts:new Date('2026-08-10').getTime()+1},
{iso:'2026-08-10',cliente:'Calle 7',tipo:'Moto Mandado',valor:0,repa:'Jose',pagado:true,promo:true,ts:new Date('2026-08-10').getTime()+2},
{iso:'2026-07-14',cliente:'Cliente (Centro)',tipo:'Moto Mandado',valor:0,repa:'Jose',pagado:true,promo:true,ts:new Date('2026-07-14').getTime()+1},
{iso:'2026-07-14',cliente:'Cliente (Centro)',tipo:'Moto Mandado',valor:0,repa:'Jose',pagado:true,promo:true,ts:new Date('2026-07-14').getTime()+2},
{iso:'2026-07-14',cliente:'Cliente (Centro)',tipo:'Moto Mandado',valor:0,repa:'Jose',pagado:true,promo:true,ts:new Date('2026-07-14').getTime()+3},
{iso:'2026-07-14',cliente:'Cliente (Centro)',tipo:'Moto Mandado',valor:0,repa:'Jose',pagado:true,promo:true,ts:new Date('2026-07-14').getTime()+4},
{iso:'2026-07-14',cliente:'Cliente (Centro)',tipo:'Moto Mandado',valor:0,repa:'Jose',pagado:true,promo:true,ts:new Date('2026-07-14').getTime()+5},
{iso:'2026-07-14',cliente:'Cliente (Centro)',tipo:'Moto Mandado',valor:0,repa:'Jose',pagado:true,promo:true,ts:new Date('2026-07-14').getTime()+6},
{iso:'2026-07-03',cliente:'Cliente (Centro)',tipo:'Moto Mandado',valor:0,repa:'Jose',pagado:true,promo:true,ts:new Date('2026-07-03').getTime()+1},
{iso:'2026-07-03',cliente:'Cliente (Centro)',tipo:'Moto Mandado',valor:0,repa:'Jose',pagado:true,promo:true,ts:new Date('2026-07-03').getTime()+2},
{iso:'2026-07-03',cliente:'Cliente (Centro)',tipo:'Moto Mandado',valor:0,repa:'Jose',pagado:true,promo:true,ts:new Date('2026-07-03').getTime()+3},
{iso:'2026-07-03',cliente:'Cliente (Centro)',tipo:'Moto Mandado',valor:0,repa:'Jose',pagado:true,promo:true,ts:new Date('2026-07-03').getTime()+4},
{iso:'2026-07-03',cliente:'Cliente (Centro)',tipo:'Moto Mandado',valor:0,repa:'Jose',pagado:true,promo:true,ts:new Date('2026-07-03').getTime()+5},
{iso:'2026-07-03',cliente:'Cliente (Centro)',tipo:'Moto Mandado',valor:0,repa:'Jose',pagado:true,promo:true,ts:new Date('2026-07-03').getTime()+6},
{iso:'2026-07-03',cliente:'Cliente (Centro)',tipo:'Moto Mandado',valor:0,repa:'Jose',pagado:true,promo:true,ts:new Date('2026-07-03').getTime()+7}
];
let ventas=JSON.parse(localStorage.getItem('ventasKigo')||'[]'),filtroFecha=null,filtroHoy='todos',filtroHistTipo='todos',editIndex=-1,fechasCobro=[],esPromo=false;
if(!localStorage.getItem('promosFinal15_ord')){
  ventas=[...ventas,...promosNuevas];
  ventas.sort((a,b)=> a.iso===b.iso? b.ts-a.ts : b.iso.localeCompare(a.iso));
  localStorage.setItem('ventasKigo',JSON.stringify(ventas));
  localStorage.setItem('promosFinal15_ord','1');
} else {
  ventas.sort((a,b)=> a.iso===b.iso? b.ts-a.ts : b.iso.localeCompare(a.iso));
}
function fmt(n){return (n||0).toLocaleString('es-CO');}
function todayISO(){return new Date().toISOString().split('T')[0];}
function showView(v){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.getElementById('view-'+v).classList.add('active');document.querySelectorAll('.bottom button').forEach(b=>b.classList.remove('active'));document.getElementById('b-'+v).classList.add('active');if(v==='hoy')renderHoy();if(v==='historial')render();if(v==='cobros')renderCobros();}
function setFiltroHoy(t){filtroHoy=t;document.getElementById('fHoyTodos').className='';document.getElementById('fHoyMandado').className='';document.getElementById('fHoyTransporte').className='';document.getElementById(t==='todos'?'fHoyTodos':t==='Moto Mandado'?'fHoyMandado':'fHoyTransporte').className='active';renderHoy();}
function setFiltroHistTipo(t){filtroHistTipo=t;document.getElementById('fHistTodos').className='';document.getElementById('fHistMandado').className='';document.getElementById('fHistTransporte').className='';document.getElementById(t==='todos'?'fHistTodos':t==='Moto Mandado'?'fHistMandado':'fHistTransporte').className='active';render();}
function togglePromo(){esPromo=!esPromo;let b=document.getElementById('btnPromo');let inp=document.getElementById('valor');let inpP=document.getElementById('valorPromo');if(esPromo){b.classList.add('active');inp.style.display='none';inpP.style.display='block';}else{b.classList.remove('active');inp.style.display='block';inpP.style.display='none';}}
function auto(){let i=document.getElementById('cliente').value.toLowerCase();let l=document.getElementById('list');if(!i){l.style.display='none';return;}let c=[...new Set(ventas.map(v=>v.cliente))].filter(x=>x.toLowerCase().includes(i)).slice(0,8);if(!c.length){l.style.display='none';return;}l.innerHTML=c.map(x=>`<div onclick="sel('${x.replace(/'/g,"\\'")}')">${x}</div>`).join('');l.style.display='block';}
function sel(c){document.getElementById('cliente').value=c;document.getElementById('list').style.display='none';}
function guardar(){let f=document.getElementById('fecha').value||todayISO();let cl=document.getElementById('cliente').value.trim();let t=document.getElementById('tipo').value;let r=document.getElementById('repa').value;let v=esPromo?0:parseInt(document.getElementById('valor').value);if(!cl||(!esPromo&&!v))return alert('Completa');let o={iso:f,cliente:cl,tipo:t,valor:v,repa:r,pagado:esPromo?true:false,promo:esPromo?true:false,ts:Date.now()};if(editIndex>=0){let p=ventas[editIndex];o.pagado=p.pagado;o.ts=p.ts;o.promo=esPromo||p.promo;ventas[editIndex]=o;editIndex=-1;document.getElementById('btnT').innerText='Confirmar';document.getElementById('btnC').style.display='none';}else ventas.unshift(o);ventas.sort((a,b)=> a.iso===b.iso? b.ts-a.ts : b.iso.localeCompare(a.iso));localStorage.setItem('ventasKigo',JSON.stringify(ventas));document.getElementById('cliente').value='';document.getElementById('valor').value='';if(esPromo)togglePromo();render();renderHoy();renderCobros();showView('hoy');}
function cancelar(){document.getElementById('cliente').value='';document.getElementById('valor').value='';if(esPromo)togglePromo();editIndex=-1;document.getElementById('btnC').style.display='none';}
function editar(i,from){let base=from==='hoy'?ventas.filter(v=>v.iso===todayISO()):(filtroFecha?ventas.filter(v=>v.iso===filtroFecha):ventas);if(from==='hoy'&&filtroHoy!=='todos')base=base.filter(v=>(v.tipo||'Moto Mandado')===filtroHoy);if(from!=='hoy'&&filtroHistTipo!=='todos')base=base.filter(v=>(v.tipo||'Moto Mandado')===filtroHistTipo);let ri=ventas.indexOf(base[i]);let v=ventas[ri];document.getElementById('cliente').value=v.cliente;document.getElementById('valor').value=v.valor;document.getElementById('repa').value=v.repa;document.getElementById('tipo').value=v.tipo||'Moto Mandado';document.getElementById('fecha').value=v.iso;if(v.promo&&!esPromo)togglePromo();else if(!v.promo&&esPromo)togglePromo();editIndex=ri;document.getElementById('btnT').innerText='Guardar';document.getElementById('btnC').style.display='block';showView('inicio');}
function eliminar(i,from){if(!confirm('Eliminar?'))return;let base=from==='hoy'?ventas.filter(v=>v.iso===todayISO()):(filtroFecha?ventas.filter(v=>v.iso===filtroFecha):ventas);if(from==='hoy'&&filtroHoy!=='todos')base=base.filter(v=>(v.tipo||'Moto Mandado')===filtroHoy);if(from!=='hoy'&&filtroHistTipo!=='todos')base=base.filter(v=>(v.tipo||'Moto Mandado')===filtroHistTipo);let ri=ventas.indexOf(base[i]);ventas.splice(ri,1);localStorage.setItem('ventasKigo',JSON.stringify(ventas));render();renderHoy();renderCobros();}
function togglePagado(i,from){let base=from==='hoy'?ventas.filter(v=>v.iso===todayISO()):(filtroFecha?ventas.filter(v=>v.iso===filtroFecha):ventas);if(from==='hoy'&&filtroHoy!=='todos')base=base.filter(v=>(v.tipo||'Moto Mandado')===filtroHoy);if(from!=='hoy'&&filtroHistTipo!=='todos')base=base.filter(v=>(v.tipo||'Moto Mandado')===filtroHistTipo);let ri=ventas.indexOf(base[i]);if(ventas[ri].promo)return;ventas[ri].pagado=!ventas[ri].pagado;localStorage.setItem('ventasKigo',JSON.stringify(ventas));render();renderHoy();renderCobros();}
function filtrarFecha(){filtroFecha=document.getElementById('filtroFecha').value||null;render();}
function limpiarFiltro(){document.getElementById('filtroFecha').value='';filtroFecha=null;render();}
function badge(t,p){if(p)return `<span class="badge badge-promo">PROMO</span>`;let tt=t||'Moto Mandado';let c=tt==='Moto Transporte'?'badge-transporte':'badge-mandado';return `<span class="badge ${c}">${tt==='Moto Transporte'?'TRANS':'MAND'}</span>`;}
function addFechaCobro(){let f=document.getElementById('cobroFecha').value;if(!f)return;if(!fechasCobro.includes(f))fechasCobro.push(f);document.getElementById('cobroFecha').value='';renderCobros();}
function limpiarFechasCobro(){fechasCobro=[];renderCobros();}
function addHoyAyer(){let h=new Date();let a=new Date();a.setDate(h.getDate()-1);let ih=h.toISOString().split('T')[0];let ia=a.toISOString().split('T')[0];if(!fechasCobro.includes(ih))fechasCobro.push(ih);if(!fechasCobro.includes(ia))fechasCobro.push(ia);renderCobros();}
function removeFecha(f){fechasCobro=fechasCobro.filter(x=>x!==f);renderCobros();}
function renderCobros(){
let repa=document.getElementById('cobroRepa').value;
document.getElementById('chipsFechas').innerHTML=fechasCobro.length?fechasCobro.map(f=>`<span class="chip">${f} <span onclick="removeFecha('${f}')">x</span></span>`).join(''):'<span style="font-size:11px;color:#6b7280">Sin fechas</span>';
let lista=fechasCobro.length?ventas.filter(v=>fechasCobro.includes(v.iso)&&!v.pagado&&!v.promo&&(repa==='todos'||v.repa===repa)):[];
let html='';
if(fechasCobro.length>0){
 html+=`<div class="card" style="margin-bottom:10px">`;
 fechasCobro.forEach(f=>{
  let items=ventas.filter(v=>v.iso===f&&!v.pagado&&!v.promo&&(repa==='todos'||v.repa===repa));
  let total=items.reduce((a,b)=>a+b.valor,0);
  let mand=items.filter(v=>(v.tipo||'Moto Mandado')==='Moto Mandado').length;
  let trans=items.filter(v=>v.tipo==='Moto Transporte').length;
  html+=`<div style="padding:8px 0;border-bottom:1px solid #f3f4f6"><b>${f}</b> - ${items.length} serv (${mand} M, ${trans} T)<br><small>Bruto $${fmt(total)} - Deuda $${fmt(items.length*5)}</small></div>`;
 });
 html+=`<div style="padding-top:10px;display:flex;justify-content:space-between"><b>TOTAL DEUDA</b><b style="color:#dc2626">$${fmt(lista.length*5)}</b></div></div>`;
}
document.getElementById('resumenCobros').innerHTML=html;
document.getElementById('cardDetalleCobros').style.display=lista.length?'block':'none';
document.getElementById('tbodyCobros').innerHTML=lista.map(v=>`<tr class="row-debe"><td>${v.iso.slice(5)}</td><td><b>${v.cliente}</b><br><small>${v.repa}</small></td><td>${badge(v.tipo,v.promo)}</td><td style="font-weight:700">$${fmt(v.valor)}</td></tr>`).join('');
lucide.createIcons();
}
function compartirCobroWhatsApp(){
let repa=document.getElementById('cobroRepa').value;
if(!fechasCobro.length)return alert('Agrega fechas');
let lista=ventas.filter(v=>fechasCobro.includes(v.iso)&&!v.pagado&&!v.promo&&(repa==='todos'||v.repa===repa));
if(!lista.length)return alert('Sin deuda');
let texto=`*KIGO XPRESS - COBRO PENDIENTE*\nRepartidor: *${repa}*\n\n`;
fechasCobro.forEach(f=>{
 let items=ventas.filter(v=>v.iso===f&&!v.pagado&&!v.promo&&(repa==='todos'||v.repa===repa));
 if(!items.length)return;
 let mand=items.filter(v=>(v.tipo||'Moto Mandado')==='Moto Mandado').length;
 let trans=items.filter(v=>v.tipo==='Moto Transporte').length;
 let bruto=items.reduce((a,b)=>a+b.valor,0);
 texto+=`📅 *Fecha ${f}*\n${mand} Moto Mandados / ${trans} Moto Transporte = ${items.length} servicios\nTotal ingresos: $${fmt(bruto)}\n*Deuda:* $${fmt(items.length*5)}\n\n`;
});
texto+=`🔴 *TOTAL DEUDA: $${fmt(lista.length*5)}* (${lista.length} servicios)\n\n*Detalle servicios:*\n`;
texto+=lista.map(v=>`• ${v.iso} - ${(v.tipo||'Moto Mandado')} - ${v.cliente} - $${fmt(v.valor)}`).join('\n');
window.open(`https://wa.me/?text=${encodeURIComponent(texto)}`,'_blank');
}
function render(){let list=filtroFecha?ventas.filter(v=>v.iso===filtroFecha):ventas;if(filtroHistTipo!=='todos')list=list.filter(v=>(v.tipo||'Moto Mandado')===filtroHistTipo);document.getElementById('tbody').innerHTML=list.map((v,i)=>{let c=v.promo?'row-promo':v.pagado?'row-pagado':'row-debe';let k=v.promo?'PROMO':v.pagado?`$${fmt(5)}`:`$0`;let val=v.promo?'PROMOCION':`$${fmt(v.valor)}`;return `<tr class="${c}"><td>${v.iso.slice(5)}</td><td><b>${v.cliente}</b><br><small>${v.repa}</small></td><td>${badge(v.tipo,v.promo)}</td><td>${val}</td><td>${k}</td><td>${v.promo?'$0':'$'+fmt(v.valor-5)}</td><td><div class="actions"><button class="icon ${v.pagado?'pagado':'debe'}" onclick="togglePagado(${i})">${v.promo?'🎁':v.pagado?'✓':'x'}</button><button class="icon" onclick="editar(${i})">✎</button><button class="icon" onclick="eliminar(${i})">🗑</button></div></td></tr>`;}).join('');let tot=list.filter(v=>!v.promo).reduce((a,b)=>a+b.valor,0);document.getElementById('sCount').innerText=fmt(list.length);document.getElementById('sBruto').innerText='$'+fmt(tot);document.getElementById('sRep').innerText='$'+fmt(tot-(list.filter(v=>!v.promo).length*5));document.getElementById('sKigo').innerText='$'+fmt(list.filter(v=>v.pagado&&!v.promo).length*5);}
function renderHoy(){let iso=todayISO();document.getElementById('hoyFecha').innerText=iso;let hoy=ventas.filter(v=>v.iso===iso);if(filtroHoy!=='todos')hoy=hoy.filter(v=>(v.tipo||'Moto Mandado')===filtroHoy);let tot=hoy.filter(v=>!v.promo).reduce((a,b)=>a+b.valor,0);document.getElementById('hCount').innerText=fmt(hoy.length);document.getElementById('hBruto').innerText='$'+fmt(tot);document.getElementById('hKigo').innerText='$'+fmt(hoy.filter(v=>v.pagado&&!v.promo).length*5);document.getElementById('hRep').innerText='$'+fmt(tot-(hoy.filter(v=>!v.promo).length*5));document.getElementById('tbodyHoy').innerHTML=hoy.map((v,i)=>{let c=v.promo?'row-promo':v.pagado?'row-pagado':'row-debe';let val=v.promo?'PROMOCION':`$${fmt(v.valor)}`;return `<tr class="${c}"><td>${new Date(v.ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</td><td><b>${v.cliente}</b></td><td>${badge(v.tipo,v.promo)}</td><td>${val}</td><td><div class="actions"><button class="icon ${v.pagado?'pagado':'debe'}" onclick="togglePagado(${i},'hoy')">${v.promo?'🎁':v.pagado?'✓':'x'}</button><button class="icon" onclick="editar(${i},'hoy')">✎</button><button class="icon" onclick="eliminar(${i},'hoy')">🗑</button></div></td></tr>`;}).join('');}
render();renderHoy();renderCobros();lucide.createIcons();
</script>
